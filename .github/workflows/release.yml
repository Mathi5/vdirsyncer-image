name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push the image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tag
        id: meta
        run: |
          # GHCR requires a lowercase owner. ${{ github.repository_owner }}
          # returns the owner's login AS DISPLAYED ("Mathi5"), and
          # ${{ github.repository }} keeps the repo casing too — the registry
          # rejects both. Lowercase it explicitly.
          OWNER="$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${OWNER}/vdirsyncer-image:${VERSION},ghcr.io/${OWNER}/vdirsyncer-image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${OWNER}/vdirsyncer-image:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VDIRSYNCER_VERSION=0.21.0
          labels: |
            org.opencontainers.image.title=vdirsyncer-image
            org.opencontainers.image.description=vdirsyncer with the google extra (aiohttp-oauthlib)
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Make the GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_OWNER: ${{ steps.meta.outputs.owner }}
          PACKAGE_NAME: vdirsyncer-image
        # The package is private by default; a public store needs a public pull.
        run: |
          status=$(gh api "/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}" --jq '.visibility // empty' 2>/dev/null || echo "")
          if [ "$status" != "public" ]; then
            gh api --method PATCH "/orgs/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}" -f visibility=public
            echo "package set to public"
          else
            echo "package already public"
          fi
          # A user-scoped package is not reachable through /orgs/; fall back to
          # the user endpoint and the raw PATCH.
          if [ "$status" != "public" ]; then
            gh api --method PATCH "/users/${PACKAGE_OWNER}/packages/container/${PACKAGE_NAME}" -f visibility=public 2>/dev/null \
              && echo "package set to public via the user endpoint" \
              || echo "could not flip visibility automatically — set it in the GitHub UI"
          fi
